<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Isaac's Games</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 2.5rem;
        background: linear-gradient(#bfe3f7, #eaf6ff 60%, #cdeec2);
        font-family: -apple-system, 'Segoe UI', sans-serif;
      }
      h1 {
        color: #2b5876;
        font-size: 2rem;
        font-weight: 600;
        margin: 0;
      }
      .games {
        display: flex;
        gap: 2rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .game-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
        padding: 2rem 2.5rem;
        border-radius: 1.5rem;
        background: #ffffffcc;
        box-shadow: 0 6px 18px #2b587622;
        text-decoration: none;
        color: #2b5876;
        font-size: 1.2rem;
        transition: transform 0.15s ease;
      }
      .game-card:hover {
        transform: scale(1.04);
      }
      .game-card .art {
        font-size: 3.5rem;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <h1>Isaac's Games</h1>
    <div class="games">
      <a class="game-card" href="/ready-go.html">
        <span class="art">🚗🚦</span>
        <span>Ready… Go!</span>
      </a>
    </div>
  </body>
</html>
